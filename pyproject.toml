[project]
name = "magic-herb-tracker"
version = "0.1.0"
description = "A grow tracking app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "kaki>=0.1.9",
    "kivy>=2.3.1",
    "kivy-garden>=0.1.5",
    "kivy-garden-matplotlib>=0.1.1.dev0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "Pillow>=10.0",
    "pip>=26.0",
    "python3-distutils>=0.0.1",
    "watchdog>=6.0.0",
]

[tool.uv.workspace]
members = [
    "magic_herb_tracker",
]
